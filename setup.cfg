[metadata]
name = bnbpy
version = 0.2.0
description = A Python general Branch & Bound framework.
long_description = file: README.md
long_description_content_type = text/markdown
author = Bruno Scalia C. F. Leite
author_email = bruscalia12@gmail.com
license = MIT
url = https://github.com/bruscalia/bnbpy

[options]
packages = find:
package_dir =
    =src
# Include Cython files (pyx, pxd, pyi) to use cimports
include_package_data = True
python_requires = >=3.10
install_requires =
    numpy>=1.21
    scipy>=1.9
    Cython==3.*
    matplotlib==3.*
    networkx==3.*
    gif==23.*

[options.packages.find]
where = src

[options.package_data]
bnbpy =
    py.typed
    *.py
    cython/*.pyx
    cython/*.pxd
    cython/*.pyi
bnbprob =
    py.typed
    *.py
    pafssp/cpp/*.cpp
    pafssp/cpp/*.hpp
    pafssp/cpp/*.pxd
    pafssp/cython/*.pyx
    pafssp/cython/*.pxd
    pafssp/cython/*.pyi
    maxclique/*.pyx
    maxclique/*.pxd
    maxclique/*.pyi

[options.exclude_package_data]
# C++ files generated by Cython are only needed to build the extensions
bnbpy =
    cython/*.cpp
bnbprob.pafssp.cython =
    *.cpp
bnbprob.maxclique =
    *.cpp

[options.extras_require]
lint =
    pytest==7.*
    pytest-mock==3.14.*
    pytest-cov==6.2.*
    ruff==0.13.*
    mypy==1.*
    pydantic==2.*
    pandas==2.*
tests =
    %(lint)s
    pyomo==6.*
    pandas[excel]==2.*
dev =
    %(tests)s
    ipykernel
    highspy==1.8.*
    sphinx==9.*
    sphinx-rtd-theme==3.*
